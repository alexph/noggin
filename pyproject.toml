[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "noggin"
version = "0.1.0"
description = "Project memory and skills for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.15,<1"]

[project.scripts]
noggin = "noggin.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyyaml>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/noggin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
